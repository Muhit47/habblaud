# Habblaud on local Docker.
#
# Bring it up with `npm run docker:up`: the script detects Claude Code accounts on the host and generates
# docker-compose.override.yml (not under version control) with:
#   - READ-ONLY mounts of <account>/projects and <account>/sessions in /claude/<account>/...
#     (never the entire account folder: that contains credentials and configuration) and ~/.habblaud/usage
#     (5h/weekly usage captured by the statusline tap) in /usage;
#   - from Codex, ONLY <folder>/sessions, <folder>/archived_sessions and <folder>/thread-writer-locks in
#     /codex/<account>/... (never auth.json, config.toml, history.jsonl, logs or the SQLite databases);
#   - HABBLAUD_CLAUDE_DIRS, HABBLAUD_CODEX_DIRS, HABBLAUD_ACCOUNTS and HABBLAUD_USAGE_DIR.
# Compose merges the override automatically into any `docker compose ...` run in this folder.
name: habblaud

services:
  habblaud:
    build: .
    image: habblaud:local
    container_name: habblaud
    restart: unless-stopped
    # Transcripts are sensitive: by default the port is published ONLY on the host's local interface
    # (HABBLAUD_BIND=0.0.0.0 in .env exposes it to the local network; see README).
    ports:
      - "${HABBLAUD_BIND:-127.0.0.1}:${HABBLAUD_PORT:-4747}:4747"
      # The port for mobile access (with login) is only published after `npm run remote:setup`: it is joined by
      # the docker-compose.override.yml that `docker:up` generates.
    volumes:
      - habblaud-data:/data
    # Options that can come from .env (or the environment) into the container.
    environment:
      HABBLAUD_ALLOWED_HOSTS: ${HABBLAUD_ALLOWED_HOSTS:-}
      HABBLAUD_DEMO: ${HABBLAUD_DEMO:-}
      # The same value as the published port above: the terminal (and what acts on the sessions) only connects with local bind.
      HABBLAUD_BIND: ${HABBLAUD_BIND:-127.0.0.1}
      HABBLAUD_TERMINAL: ${HABBLAUD_TERMINAL:-}
      # 0 disables messages through the office (sending messages to agents via page and terminal).
      HABBLAUD_MENSAGENS: ${HABBLAUD_MENSAGENS:-}
      # 0 disables new version check (GitHub release check every 6 hours).
      HABBLAUD_UPDATE_CHECK: ${HABBLAUD_UPDATE_CHECK:-}
      HABBLAUD_LANG: ${HABBLAUD_LANG:-}
      # 0 disables Codex sessions in the office.
      HABBLAUD_CODEX: ${HABBLAUD_CODEX:-}
      # 1 enables the New agent via office (in Docker, the host helper begins the session, `npm run
      # codex:bridge`; the interactive terminal itself does not run in the container).
      HABBLAUD_PTY: ${HABBLAUD_PTY:-}
      # Remote access with login (server/http/remote.ts).
      HABBLAUD_REMOTE_USER: ${HABBLAUD_REMOTE_USER:-}
      HABBLAUD_REMOTE_PASSWORD_HASH: ${HABBLAUD_REMOTE_PASSWORD_HASH:-}
      HABBLAUD_REMOTE_ALLOW: ${HABBLAUD_REMOTE_ALLOW:-}
      HABBLAUD_REMOTE_INSECURE_HTTP: ${HABBLAUD_REMOTE_INSECURE_HTTP:-}
      # Habblaud World (enabled by default: server.habblaud.com; nothing leaves before account creation). HABBLAUD_WORLD=0 turns it all off.
      HABBLAUD_WORLD: ${HABBLAUD_WORLD:-}
      HABBLAUD_WORLD_URL: ${HABBLAUD_WORLD_URL:-}
      HABBLAUD_WORLD_DEV: ${HABBLAUD_WORLD_DEV:-}
    # The host seen from inside the container (local Habblaud World server under test: HABBLAUD_WORLD_URL=
    # http://host.docker.internal:<port> with HABBLAUD_WORLD_DEV=1). In Docker Desktop the name already exists; on Linux,
    # `host-gateway` points it to the host. Harmless without World.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Hardening: read-only file system (except /data and /tmp), no extra capabilities.
    read_only: true
    # /tmp in memory, with a limit: without `size` Docker lets it use half of the host's RAM.
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Minimal init process: forwards signals and reaps orphan processes.
    init: true

volumes:
  habblaud-data:
