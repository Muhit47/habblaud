# Automatic dependency updates (Dependabot).
# Documentation: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # npm dependencies (package.json and package-lock.json at root)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Types follow the minimum Node version supported by Habblaud (engines: >=22.12). With a newer version,
      # typecheck would allow non-existent APIs. Update manually, along with engines and CI.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Dockerfile base images (node:24-alpine)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Image stays on a Node LTS version. Upgrade major version (e.g., 24 -> 26 when 26 becomes LTS) manually.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Actions used in .github/workflows/ci.yml (actions/checkout, actions/setup-node)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
